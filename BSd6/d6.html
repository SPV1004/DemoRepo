<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <h3 class="mb-4 text-center">Website Feedback</h3>

      <form>

        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>

        <!-- Feedback Message -->
        <div class="mb-3">
          <label class="form-label">Feedback</label>
          <textarea class="form-control" rows="4" placeholder="Write your feedback here"></textarea>
        </div>

        <!-- How did you find the site -->
        <div class="mb-3">
          <label class="form-label">How did you find our site?</label>
          <select class="form-select">
            <option selected disabled>Select an option</option>
            <option>Search Engine</option>
            <option>Social Media</option>
            <option>Friend / Referral</option>
            <option>Advertisement</option>
            <option>Other</option>
          </select>
        </div>

        <!-- Satisfaction Level -->
        <div class="mb-4">
          <label class="form-label d-block">Satisfaction Level</label>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="satisfaction" id="s1">
            <label class="form-check-label" for="s1">1</label>
          </div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="satisfaction" id="s2">
            <label class="form-check-label" for="s2">2</label>
          </div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="satisfaction" id="s3">
            <label class="form-check-label" for="s3">3</label>
          </div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="satisfaction" id="s4">
            <label class="form-check-label" for="s4">4</label>
          </div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="satisfaction" id="s5">
            <label class="form-check-label" for="s5">5</label>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">
            Submit Feedback
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

</body>
</html>
