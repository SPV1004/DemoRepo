<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link as Button</title>

    <style>
       
        a.button {
            display: inline-block;
            padding: 12px 25px;
            background-color: blue;
            color: white;
            text-decoration: none; 
            border-radius: 5px;
            font-size: 16px;
        }

        
        a.button:hover {
            opacity: 0.7; 
        }
    </style>
</head>
<body>

    
    <a href="https://www.google.com/" class="button">GOOGLE</a>

</body>
</html>
