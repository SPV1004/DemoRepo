<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eee;
        }

        .left {
            width: 50%;
            height: 100vh;
            float: left;
            background: linear-gradient(
        to bottom,
        #bbb1bd ,
        #ffe6b0);

        }

        .right {
            width: 50%;
            height: 100vh;
            float: left;
            background-color: white;
        }

      
        .login-box {
            width: 80%;
            margin: 100px auto;
        }

        h2 {
            color: #c44a1c;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        .remember {
            margin-top: 10px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background-color: #c44a1c;
            color: white;
            border: none;
            cursor: pointer;
        }


        @media (max-width: 768px) {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }

            .login-box {
                margin-top: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="left"></div>

    <div class="right">
        <div class="login-box">
            <h2>Login Form</h2>

            <label>Email :</label>
            <input type="email">

            <label>Password :</label>
            <input type="password">

            <div class="remember">
                <input type="checkbox"> Remember Me
            </div>

            <button>Login</button>
        </div>
    </div>

</body>
</html>
