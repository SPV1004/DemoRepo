<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px auto;
        }

        table, th, td {
            border: 2px solid black; 
        }

        th, td {
            background-color: grey; 
            color: white;            
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Id</th>
            <th>Product Name</th>
            <th>Product Price</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Laptop</td>
            <td>$800</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Mobile Phone</td>
            <td>$500</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Headphones</td>
            <td>$100</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Keyboard</td>
            <td>$50</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Mouse</td>
            <td>$25</td>
        </tr>
    </table>

</body>
</html>
