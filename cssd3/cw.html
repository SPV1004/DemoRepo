<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Info</title>

<style>

  h3.company-name {
    text-align: right;
    color: #2a7ae2;
    font-family: "Georgia", serif;  
    margin-bottom: 5px;
  }

  .tagline {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;            
    margin-bottom: 25px;
    font-family: Arial, sans-serif;
  }

  
  table.contact-table {
    width: 50%;
    margin: 0 auto;                
    border-collapse: collapse;
  }

  table.contact-table th,
  table.contact-table td {
    border: 1px solid #000;       
    padding: 12px;
    text-align: center;            
    vertical-align: middle;        
    font-family: Arial, sans-serif;
  }
</style>

</head>
<body>

<h3 class="company-name">Acme Innovations Ltd.</h3>
<p class="tagline">leading the future of smart solutions</p>

<table class="contact-table">
  <tr>
    <th>Department</th>
    <th>Contact Number</th>
  </tr>
  <tr>
    <td>Customer Service</td>
    <td>+1-555-200-1234</td>
  </tr>
  <tr>
    <td>Technical Support</td>
    <td>+1-555-300-5678</td>
  </tr>
</table>

</body>
</html>
