<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

</head>
<body>
<div class="container-fluid">



   <div class="row">

  </div>

  <div class="row">
    <div class="col-6" style="background-color:rgb(105, 17, 31);">col_1</div>

  </div>

</div>

<div class="row">

</div>



<div class="row">
    <div class="col-4" style="background-color:rgb(25, 35, 225);">col_1</div>
    <div class="col-1" style="background-color:rgb(10, 1, 15);">col_1</div>
    <div class="col-7" style="background-color:rgb(72, 28, 62);">col_1</div>
</div>


<div class="row">
    <div class="col-10" style="background-color:rgb(35, 13, 24);">col_1</div>
    <div class="col-2" style="background-color:rgb(230, 76, 25);">col_1</div>
    
</div>






</div>

</html>
