<!DOCTYPE html>
<html>
<head>
<style>
.product-card {
    border: 2px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin: 20px auto;
    width: 60%;
    max-width: 500px;
    height: 400px;
}

.product-card img {
    max-width: 100%;
    min-width: 200px;
    height: auto;
    display: block;
    margin: 0 auto ;
}

.product-name {
    font-size: 20px;
    font-weight: bold;
    margin: 0 0 10px;
}

.product-description {
    font-size: 16px;
    line-height: 1.4;
    margin: 0;
}
</style>
</head>

<body>

<div class="product-card">
    <img src="image.png" alt="Product Image">
    <div class="product-name">The Flexibell</div>
    <div class="product-description">
        India's #1 Selling Dumbbell – Get 15 pairs of dumbbells in 1 revolutionary design and change weights lightning fast with the click of a dial.
    </div>
</div>

</body>
</html>
